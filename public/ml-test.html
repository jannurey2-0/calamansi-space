<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Model Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">🤖 ML Model Testing Dashboard</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- Model Status -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">📊 Model Status</h2>
                <div id="model-status" class="space-y-2">
                    <div class="flex items-center gap-2 text-slate-600">
                        <i class="fa-solid fa-circle-notch fa-spin text-amber-500"></i>
                        <span>Checking model status...</span>
                    </div>
                </div>
            </div>

            <!-- Test Controls -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">🔧 Test Controls</h2>
                <div class="space-y-3">
                    <button id="generate-data-btn" 
                            class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-database"></i>
                        Generate Test Data
                    </button>
                    
                    <button id="train-model-btn" 
                            class="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-brain"></i>
                        Train ML Model
                    </button>
                    
                    <button id="test-prediction-btn" 
                            class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-chart-line"></i>
                        Test Prediction
                    </button>
                </div>
            </div>
        </div>

        <!-- Test Results -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">📈 Test Results</h2>
            <div id="test-results" class="space-y-4">
                <div class="text-slate-500 italic">No tests run yet...</div>
            </div>
        </div>
    </div>

    <!-- Firebase Config -->
    <script type="module">
        // Import Firebase and ML modules
        import { app } from './firebase-config.js';
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import mlModel from './js/ml-service.js';
        import './js/data-generator.js';

        // Make globals available
        window.mlModel = mlModel;
        
        // DOM Elements
        const modelStatusEl = document.getElementById('model-status');
        const generateDataBtn = document.getElementById('generate-data-btn');
        const trainModelBtn = document.getElementById('train-model-btn');
        const testPredictionBtn = document.getElementById('test-prediction-btn');
        const testResultsEl = document.getElementById('test-results');

        // Update model status display
        function updateModelStatus() {
            const status = mlModel.getStatus();
            modelStatusEl.innerHTML = `
                <div class="flex items-center gap-2 ${status.isTrained ? 'text-green-600' : 'text-amber-600'}">
                    <i class="fa-solid ${status.isTrained ? 'fa-check-circle' : 'fa-circle-exclamation'}"></i>
                    <span>${status.isTrained ? 'Model Trained' : 'Model Not Trained'}</span>
                </div>
                ${status.isTrained ? `
                    <div class="text-sm text-slate-500 mt-2">
                        <div>Trained: ${status.trainedAt ? status.trainedAt.toLocaleString() : 'Unknown'}</div>
                        <div>Samples: ${status.sampleSize || 0}</div>
                    </div>
                ` : ''}
            `;
        }

        // Add test result
        function addTestResult(title, content, isSuccess = true) {
            const resultEl = document.createElement('div');
            resultEl.className = `p-4 rounded-lg border ${isSuccess ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
            resultEl.innerHTML = `
                <div class="font-medium ${isSuccess ? 'text-green-800' : 'text-red-800'}">${title}</div>
                <div class="text-sm mt-1 ${isSuccess ? 'text-green-700' : 'text-red-700'}">${content}</div>
            `;
            testResultsEl.prepend(resultEl);
        }

        // Event Listeners
        generateDataBtn.addEventListener('click', async () => {
            generateDataBtn.disabled = true;
            generateDataBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
            
            try {
                const result = await window.generateTestData();
                addTestResult(
                    '✅ Data Generation Complete', 
                    `Generated ${result.sensorRecords} sensor records and ${result.yieldRecords} yield records`
                );
                updateModelStatus();
            } catch (error) {
                addTestResult('❌ Data Generation Failed', error.message, false);
            } finally {
                generateDataBtn.disabled = false;
                generateDataBtn.innerHTML = '<i class="fa-solid fa-database"></i> Generate Test Data';
            }
        });

        trainModelBtn.addEventListener('click', async () => {
            trainModelBtn.disabled = true;
            trainModelBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Training...';
            
            try {
                const success = await mlModel.train();
                if (success) {
                    addTestResult('✅ Model Training Successful', 'ML model trained with available data');
                } else {
                    addTestResult('⚠️ Training Failed', 'Insufficient data for training', false);
                }
                updateModelStatus();
            } catch (error) {
                addTestResult('❌ Training Error', error.message, false);
            } finally {
                trainModelBtn.disabled = false;
                trainModelBtn.innerHTML = '<i class="fa-solid fa-brain"></i> Train ML Model';
            }
        });

        testPredictionBtn.addEventListener('click', async () => {
            testPredictionBtn.disabled = true;
            testPredictionBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Predicting...';
            
            try {
                // Create sample current data
                const currentData = [{
                    temperature: 26.5,
                    humidity: 72.0,
                    avgSoilMoisture: 34.2,
                    timestamp: new Date()
                }];
                
                const prediction = mlModel.predict(currentData);
                
                if (prediction && prediction.yield > 0) {
                    addTestResult(
                        '✅ Prediction Generated', 
                        `Predicted Yield: ${prediction.yield.toFixed(1)}kg (${prediction.quality})<br>
                         Confidence: ${Math.round(prediction.confidence)}%<br>
                         Message: ${prediction.message}`
                    );
                } else {
                    addTestResult('⚠️ Prediction Failed', 'Model not ready or insufficient data', false);
                }
            } catch (error) {
                addTestResult('❌ Prediction Error', error.message, false);
            } finally {
                testPredictionBtn.disabled = false;
                testPredictionBtn.innerHTML = '<i class="fa-solid fa-chart-line"></i> Test Prediction';
            }
        });

        // Initialize
        updateModelStatus();
        addTestResult('🚀 Test Environment Ready', 'ML testing dashboard initialized');
    </script>
</body>
</html>
