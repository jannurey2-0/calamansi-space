<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yield History Data Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-green-50 to-lime-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-lime-600 to-green-600 p-6">
                <h1 class="text-2xl font-bold text-white flex items-center gap-3">
                    <i class="fa-solid fa-seedling"></i>
                    Yield History Data Generator
                </h1>
                <p class="text-lime-100 mt-2">Generate comprehensive farming data for ML model training</p>
            </div>

            <!-- Main Content -->
            <div class="p-6">
                <!-- Quick Actions -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <button id="generate-full-btn" 
                            class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex flex-col items-center">
                        <i class="fa-solid fa-rocket text-2xl mb-2"></i>
                        <span>Full Training Dataset</span>
                        <span class="text-sm opacity-90 mt-1">90 days sensor + 20 yield records</span>
                    </button>

                    <button id="generate-yield-btn" 
                            class="bg-gradient-to-r from-blue-500 to-cyan-600 hover:from-blue-600 hover:to-cyan-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex flex-col items-center">
                        <i class="fa-solid fa-chart-line text-2xl mb-2"></i>
                        <span>Yield Records Only</span>
                        <span class="text-sm opacity-90 mt-1">Generate 15 harvest records</span>
                    </button>

                    <button id="generate-sensor-btn" 
                            class="bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex flex-col items-center">
                        <i class="fa-solid fa-temperature-half text-2xl mb-2"></i>
                        <span>Sensor Data Only</span>
                        <span class="text-sm opacity-90 mt-1">60 days environmental data</span>
                    </button>
                </div>

                <!-- Custom Generator -->
                <div class="bg-slate-50 rounded-xl p-6 mb-8">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-sliders"></i>
                        Custom Data Generation
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Sensor Days</label>
                            <input type="number" id="sensor-days" value="45" min="7" max="180" 
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-lime-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Yield Records</label>
                            <input type="number" id="yield-count" value="10" min="3" max="50" 
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-lime-500 focus:border-transparent">
                        </div>
                    </div>
                    <button id="generate-custom-btn" 
                            class="mt-4 w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-300">
                        <i class="fa-solid fa-gear mr-2"></i>
                        Generate Custom Dataset
                    </button>
                </div>

                <!-- Status Panel -->
                <div class="bg-white border border-slate-200 rounded-xl p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-circle-info"></i>
                        Generation Status
                    </h2>
                    <div id="status-messages" class="space-y-3">
                        <div class="text-slate-500 italic">Ready to generate data...</div>
                    </div>
                </div>
            </div>

            <!-- Footer Info -->
            <div class="bg-slate-50 p-4 border-t border-slate-200">
                <div class="text-center text-sm text-slate-600">
                    <p class="mb-2">📊 Data will be saved to your Firebase collections:</p>
                    <div class="flex flex-wrap justify-center gap-4 text-xs">
                        <span class="bg-lime-100 text-lime-800 px-2 py-1 rounded">dataCollectionSensor</span>
                        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded">farm_history</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import required modules
        import { app } from './firebase-config.js';
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import dataGenerator from './js/data-generator.js';

        // DOM Elements
        const generateFullBtn = document.getElementById('generate-full-btn');
        const generateYieldBtn = document.getElementById('generate-yield-btn');
        const generateSensorBtn = document.getElementById('generate-sensor-btn');
        const generateCustomBtn = document.getElementById('generate-custom-btn');
        const statusMessages = document.getElementById('status-messages');

        // Add status message
        function addStatusMessage(message, isSuccess = true, isBold = false) {
            const messageEl = document.createElement('div');
            messageEl.className = `p-3 rounded-lg ${isSuccess ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`;
            messageEl.innerHTML = `
                <div class="${isBold ? 'font-semibold' : ''} ${isSuccess ? 'text-green-800' : 'text-red-800'}">
                    ${message}
                </div>
            `;
            statusMessages.appendChild(messageEl);
            statusMessages.scrollTop = statusMessages.scrollHeight;
        }

        // Add progress message with percentage
        function addProgressMessage(current, total, itemType) {
            const progress = Math.round((current / total) * 100);
            const messageEl = document.createElement('div');
            messageEl.className = 'p-3 rounded-lg bg-blue-50 border border-blue-200';
            messageEl.innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-spinner fa-spin text-blue-600"></i>
                    <div class="flex-1">
                        <div class="text-blue-800 font-medium">${itemType} Progress: ${current}/${total} (${progress}%)</div>
                        <div class="w-full bg-blue-200 rounded-full h-2 mt-2">
                            <div class="bg-blue-600 h-2 rounded-full" style="width: ${progress}%"></div>
                        </div>
                    </div>
                </div>
            `;
            
            // Remove previous progress message if exists
            const existingProgress = statusMessages.querySelector('.bg-blue-50');
            if (existingProgress) {
                existingProgress.remove();
            }
            
            statusMessages.appendChild(messageEl);
            statusMessages.scrollTop = statusMessages.scrollHeight;
        }

        // Clear status messages
        function clearStatus() {
            statusMessages.innerHTML = '';
        }

        // Update button state
        function setButtonState(button, isLoading, text) {
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>${text}`;
            } else {
                button.disabled = false;
                // Reset button text based on ID
                switch(button.id) {
                    case 'generate-full-btn':
                        button.innerHTML = '<i class="fa-solid fa-rocket text-2xl mb-2"></i><span>Full Training Dataset</span><span class="text-sm opacity-90 mt-1">90 days sensor + 20 yield records</span>';
                        break;
                    case 'generate-yield-btn':
                        button.innerHTML = '<i class="fa-solid fa-chart-line text-2xl mb-2"></i><span>Yield Records Only</span><span class="text-sm opacity-90 mt-1">Generate 15 harvest records</span>';
                        break;
                    case 'generate-sensor-btn':
                        button.innerHTML = '<i class="fa-solid fa-temperature-half text-2xl mb-2"></i><span>Sensor Data Only</span><span class="text-sm opacity-90 mt-1">60 days environmental data</span>';
                        break;
                    case 'generate-custom-btn':
                        button.innerHTML = '<i class="fa-solid fa-gear mr-2"></i>Generate Custom Dataset';
                        break;
                }
            }
        }

        // Event Listeners
        generateFullBtn.addEventListener('click', async () => {
            clearStatus();
            setButtonState(generateFullBtn, true, 'Generating Full Dataset...');
            addStatusMessage('🚀 Starting comprehensive training data generation...', true, true);

            try {
                // Add progress tracking
                addStatusMessage('📊 Generating 720 sensor records (this may take 30-60 seconds)...', true);
                
                const result = await dataGenerator.generateTrainingDataset();
                addStatusMessage(`✅ Success! Generated ${result.sensorRecords} sensor records and ${result.yieldRecords} yield records`, true, true);
                addStatusMessage('🤖 Your ML model is now ready for training!', true, true);
                addStatusMessage('💡 Tip: Refresh your dashboard to see ML predictions', true);
            } catch (error) {
                addStatusMessage(`❌ Error: ${error.message}`, false, true);
            } finally {
                setButtonState(generateFullBtn, false);
            }
        });

        generateYieldBtn.addEventListener('click', async () => {
            const count = parseInt(document.getElementById('yield-count').value) || 15;
            setButtonState(generateYieldBtn, true, `Generating ${count} Records...`);
            addStatusMessage(`🌾 Generating ${count} yield history records...`, true);

            try {
                const result = await dataGenerator.generateYieldHistory(count);
                addStatusMessage(`✅ Generated ${result} yield history records successfully`, true, true);
            } catch (error) {
                addStatusMessage(`❌ Error: ${error.message}`, false, true);
            } finally {
                setButtonState(generateYieldBtn, false);
            }
        });

        generateSensorBtn.addEventListener('click', async () => {
            const days = parseInt(document.getElementById('sensor-days').value) || 60;
            setButtonState(generateSensorBtn, true, `Generating ${days} Days...`);
            addStatusMessage(`🌡️ Generating ${days} days of sensor data...`, true);

            try {
                const result = await dataGenerator.generateSensorData(days, 8);
                addStatusMessage(`✅ Generated ${result} sensor records successfully`, true, true);
            } catch (error) {
                addStatusMessage(`❌ Error: ${error.message}`, false, true);
            } finally {
                setButtonState(generateSensorBtn, false);
            }
        });

        generateCustomBtn.addEventListener('click', async () => {
            const days = parseInt(document.getElementById('sensor-days').value) || 45;
            const count = parseInt(document.getElementById('yield-count').value) || 10;
            
            setButtonState(generateCustomBtn, true, 'Generating Custom Data...');
            addStatusMessage(`⚙️ Generating custom dataset: ${days} days sensor data + ${count} yield records`, true, true);

            try {
                const [sensorResult, yieldResult] = await Promise.all([
                    dataGenerator.generateSensorData(days, 6),
                    dataGenerator.generateYieldHistory(count)
                ]);
                
                addStatusMessage(`✅ Custom dataset complete!`, true, true);
                addStatusMessage(`📊 Sensor Records: ${sensorResult}`, true);
                addStatusMessage(`📊 Yield Records: ${yieldResult}`, true);
            } catch (error) {
                addStatusMessage(`❌ Error: ${error.message}`, false, true);
            } finally {
                setButtonState(generateCustomBtn, false);
            }
        });

        // Initialize
        addStatusMessage('🌱 Yield History Data Generator Ready', true, true);
        addStatusMessage('Click any button above to start generating training data for your ML model');
    </script>
</body>
</html>
